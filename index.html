<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProyectDungeon · arnés</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1117;
        --panel: #151b23;
        --ink: #edf2f7;
        --muted: #9aa7b8;
        --border: #2a3544;
        --accent: #e8b86d;
        --accent-2: #7fb3d5;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(1200px 600px at 90% -10%, rgba(127, 179, 213, 0.12), transparent 60%),
          radial-gradient(900px 500px at 0% 0%, rgba(232, 184, 109, 0.08), transparent 55%),
          var(--bg);
        color: var(--ink);
        padding: 24px;
      }
      main {
        width: min(820px, 100%);
        display: grid;
        gap: 18px;
        padding: clamp(24px, 5vw, 48px);
        border: 1px solid var(--border);
        border-radius: 20px;
        background: rgba(21, 27, 35, 0.86);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
      }
      .eyebrow {
        width: fit-content;
        padding: 4px 9px;
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--accent);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 { margin: 0; font-size: clamp(2rem, 5vw, 3.4rem); letter-spacing: -0.03em; }
      p { margin: 0; color: var(--muted); line-height: 1.6; }
      nav { display: flex; flex-wrap: wrap; gap: 10px; padding-top: 6px; }
      a {
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--ink);
        font-weight: 700;
        text-decoration: none;
      }
      a.primary { border-color: rgba(232, 184, 109, 0.55); background: var(--accent); color: #1a1206; }
      a:hover { border-color: var(--accent-2); }
      code { color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <span class="eyebrow">ProyectDungeon · fase 0</span>
      <h1>Arnés de desarrollo</h1>
      <p>
        Documentación OKF, agentes y experimentos interactivos. Todavía no hay
        código de juego: este arranque sirve para validar el loop de trabajo.
      </p>
      <nav>
        <a class="primary" href="/experiments/">Abrir experimentos</a>
        <a href="/docs/index.md">Documentación</a>
        <a href="/docs/harness/workflow.md">Flujo de trabajo</a>
      </nav>
      <p><code>pnpm run dev</code> · <code>pnpm run verify</code></p>
    </main>
  </body>
</html>
