<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>ProyectDungeon · sala</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #06080c;
        --ink: #edf2f7;
        --muted: #9aa7b8;
        --line: #22303f;
        --accent: #e8b86d;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background:
          radial-gradient(900px 500px at 50% -10%, rgba(127, 179, 213, 0.1), transparent 60%),
          var(--bg);
        color: var(--ink);
      }
      main {
        width: 100%;
        display: grid;
        justify-items: center;
        gap: 10px;
      }
      canvas {
        display: block;
        width: min(100%, calc((100vh - 96px) * (960 / 600)));
        height: auto;
        aspect-ratio: 960 / 600;
        image-rendering: pixelated;
        background: #080b10;
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      }
      .error {
        margin: 0;
        max-width: 60ch;
        color: #ffb4a8;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      footer {
        font-size: 0.78rem;
        color: var(--muted);
      }
      footer a {
        color: var(--muted);
        text-decoration: none;
        border-bottom: 1px dotted rgba(154, 167, 184, 0.5);
      }
      footer a:hover,
      footer a:focus-visible { color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <canvas
        id="game-canvas"
        width="960"
        height="600"
        role="img"
        aria-label="Sala de mazmorra con un caballero y un goblin"
      ></canvas>
      <p id="game-error" class="error" role="alert" hidden></p>
      <footer><a href="/experiments/">Experimentos</a></footer>
    </main>
    <script type="module" src="/src/host/main.ts"></script>
  </body>
</html>
